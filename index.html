<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Orb</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        const particleCount = 200;
        const orbRadius = 150;
        const particleRadius = 2;
        
        // Resize canvas to window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Particle class
        class Particle {
            constructor() {
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * orbRadius;
                this.x = canvas.width / 2 + Math.cos(this.angle) * this.radius;
                this.y = canvas.height / 2 + Math.sin(this.angle) * this.radius;
                this.homeX = canvas.width / 2 + Math.cos(this.angle) * orbRadius;
                this.homeY = canvas.height / 2 + Math.sin(this.angle) * orbRadius;
                this.speedX = 0;
                this.speedY = 0;
                this.size = particleRadius;
                this.distortionFactor = 0;
            }
            
            update() {
                // Attraction back to home position
                const dx = this.homeX - this.x;
                const dy = this.homeY - this.y;
                this.speedX += dx * 0.01;
                this.speedY += dy * 0.01;
                
                // Add some distortion effect (push away)
                this.distortionFactor = Math.sin(Date.now() * 0.001) * 2;
                
                // Apply distortion
                for (let i = 0; i < particles.length; i++) {
                    const other = particles[i];
                    if (other !== this) {
                        const dx = this.x - other.x;
                        const dy = this.y - other.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 50) {
                            const force = (50 - distance) / 50;
                            this.speedX += dx * force * 0.03 * this.distortionFactor;
                            this.speedY += dy * force * 0.03 * this.distortionFactor;
                        }
                    }
                }
                
                // Apply friction
                this.speedX *= 0.92;
                this.speedY *= 0.92;
                
                // Update position
                this.x += this.speedX;
                this.y += this.speedY;
            }
            
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Initialize particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
        }
        
        initParticles();
        animate();
    </script>
</body>
</html>
